version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: [dependencies, devops]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: [dependencies, dx]
    groups:
      bundler-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bundler"
    directory: "/myapp"
    schedule:
      interval: "weekly"
    labels: [dependencies, myapp]
    groups:
      myapp-bundler-dependencies:
        patterns:
          - "*"
