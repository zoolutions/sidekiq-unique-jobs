plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Include:
    - "**/examples/**/*.rb"
    - "**/*.rb"
  Exclude:
    - "**/*.erb"
    - "**/.DS_Store"
    - "**/*.lua"
    - "assets/**/*"
    - "bin/**/*"
    - "doc/**/*"
    # The docs site (docs/) is a self-contained nested Rails app with its own
    # .rubocop.yml (docs-kit's shipped cops + rubocop-rails-omakase). It lints
    # itself in its own CI job; the gem's cops don't apply to it. BOTH patterns
    # are required: `docs/**/*` excludes the files, but RuboCop's target finder
    # still DESCENDS into docs/ and loads docs/.rubocop.yml — which `require`s
    # gems (docs_kit/rubocop) not in the gem's bundle, crashing the run before a
    # file is inspected. The bare `docs` entry prunes the directory from traversal
    # so its config is never read.
    - "docs"
    - "docs/**/*"
    - "lib/sidekiq_unique_jobs/lua/**/*"
    - "lib/sidekiq_unique_jobs/web/views/**/*"
    - "lib/tasks/**/*"
    - "myapp/**/*"
    - "Sidekiq/**/*"
    - "vendor/**/*"

Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/EndAlignment:
  EnforcedStyleAlignWith: variable

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/HashAlignment:
  EnforcedColonStyle: key
  EnforcedHashRocketStyle: key
  EnforcedLastArgumentHashStyle: always_inspect

Layout/LineContinuationLeadingSpace:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Lint/AmbiguousBlockAssociation:
  Exclude:
    - spec/**/*

Lint/EmptyBlock:
  Exclude:
    - spec/**/*

Lint/SuppressedException:
  Enabled: true

Lint/UselessAssignment:
  Enabled: true

Metrics:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: true

Naming/ConstantName:
  Enabled: true

Naming/FileName:
  Enabled: true
  Exclude:
    - lib/sidekiq-unique-jobs.rb
    - Gemfile
    - Rakefile

Naming/RescuedExceptionsVariableName:
  PreferredName: ex

Naming/MethodParameterName:
  AllowedNames:
    - ex

RSpec/ContextWording:
  Enabled: true
  Prefixes:
    - when
    - with
    - without
    - if
    - unless
    - for
    - that
    - and

RSpec/DescribeClass:
  Exclude:
    - spec/sidekiq/api_spec.rb
    - spec/sidekiq_unique_jobs/core_ext_spec.rb
    - spec/sidekiq_unique_jobs/lua/**/*_spec.rb

RSpec/ExampleLength:
  Enabled: false

RSpec/ExpectActual:
  Enabled: false

RSpec/ExpectChange:
  EnforcedStyle: block

RSpec/SpecFilePathFormat:
  Enabled: true
  Exclude:
    - spec/performance/locksmith_spec.rb
    - spec/performance/lock_digest_spec.rb

RSpec/SpecFilePathSuffix:
  Enabled: true
  Exclude:
    - spec/performance/locksmith_spec.rb
    - spec/performance/lock_digest_spec.rb

RSpec/InstanceVariable:
  Exclude:
    - spec/sidekiq_unique_jobs/middleware/client/call_spec.rb
    - spec/sidekiq_unique_jobs/middleware/server/call_spec.rb

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

RSpec/RepeatedExample:
  Exclude:
    - spec/sidekiq_unique_jobs/unique_args_spec.rb

Style/Documentation:
  Enabled: true
  Exclude:
    - "examples/**/*"
    - "bin/**/*"
    - "spec/**/*"
    - "lib/sidekiq_unique_jobs/testing.rb"
    - "lib/sidekiq_unique_jobs/core_ext.rb"
    - "lib/sidekiq_unique_jobs/sidekiq_unique_ext.rb"
    - "lib/sidekiq_unique_jobs/web/**/*"

Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes
  ConsistentQuotesInMultiline: true

Style/StringLiteralsInInterpolation:
  Enabled: true

Style/SymbolArray:
  Enabled: true
  EnforcedStyle: brackets

Style/TernaryParentheses:
  Enabled: true
  EnforcedStyle: require_parentheses_when_complex
  AllowSafeAssignment: true

Style/TrailingCommaInArguments:
  Enabled: true
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  Enabled: true
  EnforcedStyleForMultiline: comma

Style/GlobalVars:
  Enabled: true

Style/ModuleFunction:
  Enabled: false


